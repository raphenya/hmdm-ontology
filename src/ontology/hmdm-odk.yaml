id: hmdm
title: "The Human Microbiome Drug Metabolism (HMDM) Ontology"
github_org: raphenya
git_main_branch: main
repo: hmdm-ontology
release_artefacts:
  - base
  - full
  - simple
primary_release: full
export_formats:
  - owl
  - obo
  - json
import_group:
  products:
    - id: ro
    - id: go
    - id: chebi
    - id: mop
    - id : ncit
    - id: doid
workflows:
  - docs
documentation:
  documentation_system: mkdocs 
    
robot_java_args: "-Xmx10G"
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit