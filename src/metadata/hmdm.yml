# PURL configuration for http://purl.obolibrary.org/obo/hmdm

idspace: HMDM
base_url: /obo/hmdm

products:
- hmdm.owl: https://raw.githubusercontent.com/raphenya/hmdm-ontology/main/hmdm.owl
- hmdm.obo: https://raw.githubusercontent.com/raphenya/hmdm-ontology/main/hmdm.obo

term_browser: ontobee
example_terms:
- HMDM_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/raphenya/hmdm-ontology/v

- prefix: /tracker/
  replacement: https://github.com/raphenya/hmdm-ontology/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/HMDM?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/raphenya/hmdm-ontology/main/

